# Pages CMS (https://app.pagescms.org): what editors can change.
# Field names are the front matter names, accents included; every field
# of the front matter is declared, as Pages CMS drops the others on save.

settings:
  commit:
    identity: user

media:
  - name: actualites
    label: Photos des actualités
    input: src/actualites/photos
    output: /actualites/photos
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: realisations
    label: Photos des réalisations
    input: src/realisations/photos
    output: /realisations/photos
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: evenements
    label: Photos des évènements
    input: src/evenements/photos
    output: /evenements/photos
    extensions: [jpg, jpeg, png, webp]
    rename: safe

  - name: pages
    label: Photos des pages
    input: src/photos
    output: /photos
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: ateliers
    label: Photos des ateliers
    input: src/ateliers/photos
    output: /ateliers/photos
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  - name: actualites
    label: Actualités
    type: collection
    path: src/actualites
    subfolders: false
    # Named from the fields at save: the name field of Pages CMS starts
    # empty, not from the title.
    filename: "{year}-{month}-{day}-{primary}.md"
    operations:
      rename: false
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Titre
        description: Avec le jour de la création, il nomme le fichier, qui ne change plus ensuite.
        type: string
        required: true
        options:
          maxlength: 70
      - name: résumé
        label: Résumé
        description: Ce dont parle l'article, en une ou deux phrases.
        type: text
      - name: couverture
        label: Couverture
        type: object
        fields:
          - name: fichier
            label: Photo
            description: 2000 px au plus en largeur et en hauteur.
            type: image
            required: true
            options:
              media: actualites
          - name: description
            label: Description
            description: Ce que montre la photo.
            type: string
            required: true
      - name: mise-en-avant
        label: Mise en avant
        description: Où et jusqu'à quand l'accueil ou l'agenda présentent l'article.
        type: object
        fields:
          - name: pages
            label: Pages
            type: select
            required: true
            options:
              multiple: true
              values:
                - value: accueil
                  label: Accueil
                - value: agenda
                  label: Agenda
          # Strings, not dates: Pages CMS fails on save when a date field
          # sits in an absent object (date-fns parse of undefined).
          - name: début
            label: Début
            description: Au format AAAA-MM-JJ ; sans début, dès la publication.
            type: string
            pattern:
              regex: '^(\d{4}-\d{2}-\d{2})?$'
              message: Une date au format AAAA-MM-JJ.
          - name: fin
            label: Fin
            description: Au format AAAA-MM-JJ ; le dernier jour de la mise en avant, pas avant le début.
            type: string
            required: true
            pattern:
              regex: '^\d{4}-\d{2}-\d{2}$'
              message: Une date au format AAAA-MM-JJ.
      - name: body
        label: Texte
        description: En Markdown ; une photo s'écrit ![ce qu'elle montre](/actualites/photos/nom.jpg).
        type: code
        options:
          format: markdown

  - name: realisations
    label: Réalisations
    type: collection
    path: src/realisations
    subfolders: false
    # Named from the fields at save, as the name field of Pages CMS is
    # generated from the empty entry: the date of the réalisation, not the
    # day of its creation.
    filename: "{date}-{primary}-{auteur}.md"
    operations:
      rename: false
    view:
      fields: [titre, date, auteur]
      primary: titre
      sort: [date, titre]
      default:
        sort: date
        order: desc
    fields:
      - name: titre
        label: Titre
        description: Ce qu'elle est. Avec la date et l'auteur, il nomme le fichier, qui ne change plus ensuite.
        type: string
        required: true
        options:
          maxlength: 70
      - name: date
        label: Date
        description: Le jour où elle a été présentée.
        type: date
        required: true
      - name: auteur
        label: Auteur
        description: Qui l'a faite.
        type: string
        required: true
      - name: catégories
        label: Catégories
        description: Au moins une.
        type: select
        required: true
        options:
          multiple: true
          values:
            - value: association
              label: Vie de l'association
            - value: bois
              label: Bois
            - value: métal
              label: Métal
            - value: matériaux-souples
              label: Matériaux souples
            - value: numérique-électronique
              label: Numérique et électronique
      - name: photos
        label: Photos
        description: Au moins une, dans l'ordre où elles sont montrées.
        type: object
        list: true
        required: true
        fields:
          - name: fichier
            label: Photo
            description: 2000 px au plus en largeur et en hauteur.
            type: image
            required: true
            options:
              media: realisations
          - name: description
            label: Description
            description: Ce que montre la photo.
            type: string
            required: true

  - name: evenements
    label: Évènements
    type: collection
    path: src/evenements
    subfolders: false
    # The name, without extension, is the address of the page and the
    # TiBillet keyword that links events to it: typed by the editor at
    # creation (the name field starts as ".md"), never renamed.
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      fields: [title, catégorie]
      primary: title
    fields:
      - name: title
        label: Titre
        description: "À la création, taper aussi un nom court dans le champ du nom de fichier (Filename) : en minuscules, sans accents, mots séparés par des tirets, finissant par .md, par exemple repar-action.md, et qui n'est pas déjà dans la liste des évènements. Sans .md, c'est le mot-clé TiBillet de la page ; il ne change plus ensuite."
        type: string
        required: true
        options:
          maxlength: 70
      - name: accroche
        label: Accroche
        description: Une phrase d'appel, sous le titre.
        type: string
      - name: rendez-vous
        label: Rendez-vous
        description: Quand il a lieu, par exemple « tous les premiers jeudis du mois ».
        type: string
        required: true
      - name: horaire
        label: Horaire
        description: À quelle heure, par exemple « 18h - 20h ».
        type: string
        required: true
      - name: catégorie
        label: Catégorie
        type: select
        required: true
        options:
          values:
            - value: association
              label: Vie de l'association
            - value: bois
              label: Bois
            - value: métal
              label: Métal
            - value: matériaux-souples
              label: Matériaux souples
            - value: numérique-électronique
              label: Numérique et électronique
      - name: prix
        label: Prix
        description: Ce qu'il coûte et à qui il est ouvert.
        type: string
        required: true
      - name: couverture
        label: Couverture
        description: La photo qui représente l'évènement, sous le titre de sa page.
        type: object
        fields:
          - name: fichier
            label: Photo
            description: 2000 px au plus en largeur et en hauteur.
            type: image
            required: true
            options:
              media: evenements
          - name: description
            label: Description
            description: Ce que montre la photo.
            type: string
            required: true
      - name: body
        label: Texte
        description: En Markdown ; une photo s'écrit ![ce qu'elle montre](/evenements/photos/nom.jpg), après l'avoir envoyée dans Médias, Photos des évènements, 2000 px au plus en largeur et en hauteur.
        type: code
        options:
          format: markdown

  # The Markdown files directly in src/, and only them: the pages whose
  # address is a single segment. Edited only; their file names are
  # their addresses.
  - name: pages
    label: Pages
    type: collection
    path: src
    subfolders: false
    # The home page has its own entry, below.
    exclude: [index.md]
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Titre
        type: string
        required: true
        options:
          maxlength: 70
      - name: catégories
        label: Catégories
        description: Celles dont la page montre les évènements et les séances, pour une page qui en montre, comme celle de l'association.
        type: select
        options:
          multiple: true
          values:
            - value: association
              label: Vie de l'association
            - value: bois
              label: Bois
            - value: métal
              label: Métal
            - value: matériaux-souples
              label: Matériaux souples
            - value: numérique-électronique
              label: Numérique et électronique
      # Hidden but kept on save: they choose the template of the page.
      - name: layout
        type: string
        hidden: true
      - name: templateEngineOverride
        type: string
        hidden: true
      - name: body
        label: Texte
        description: "En Markdown ; une photo s'écrit ![ce qu'elle montre](/photos/nom.jpg), après l'avoir envoyée dans Médias, Photos des pages, 2000 px au plus en largeur et en hauteur. Laisser en place le code du site, entre {{ }} ou {% %}."
        type: code
        options:
          format: markdown

  # The home page: its blocks, in order, and its body, which the corps
  # block places.
  - name: accueil
    label: Accueil
    type: file
    path: src/index.md
    fields:
      - name: title
        label: Titre
        type: string
        required: true
        options:
          maxlength: 70
      - name: blocs
        label: Blocs
        description: Les parties de la page d'accueil, dans l'ordre où elles s'affichent. Le bloc Texte de la page, au plus une fois, place le texte ci-dessous.
        type: block
        list: true
        blockKey: type
        blocks:
          - name: corps
            label: Texte de la page
            fields: []
          - name: articles-en-avant
            label: Articles en avant
            fields: []
          - name: ateliers
            label: Les ateliers
            fields: []
          - name: section
            label: Section d'une autre page
            fields:
              - name: page
                label: Page
                type: reference
                required: true
                options:
                  collection: pages
                  value: "{path}"
              - name: titre
                label: Titre de la section
                description: Le titre de niveau 2 de la section, tel qu'il s'affiche sur sa page ; un lien vers cette page la suit.
                type: string
                required: true
          - name: semaine
            label: Les 7 prochains jours
            fields: []
          - name: realisations
            label: Des réalisations
            fields: []
      # Hidden but kept on save: it chooses the template of the page.
      - name: layout
        type: string
        hidden: true
      - name: body
        label: Texte
        description: "En Markdown ; une photo s'écrit ![ce qu'elle montre](/photos/nom.jpg), après l'avoir envoyée dans Médias, Photos des pages, 2000 px au plus en largeur et en hauteur."
        type: code
        options:
          format: markdown

  # Edited only: the list and the short names of the ateliers are in
  # src/_data/ateliers.json.
  - name: ateliers
    label: Ateliers
    type: collection
    path: src/ateliers
    subfolders: false
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Titre
        type: string
        required: true
        options:
          maxlength: 70
      - name: accroche
        label: Accroche
        description: Une phrase d'appel, sous le nom de l'atelier sur l'accueil.
        type: string
        required: true
      - name: catégories
        label: Catégories
        description: Celles dont la page montre les évènements et les séances.
        type: select
        options:
          multiple: true
          values:
            - value: association
              label: Vie de l'association
            - value: bois
              label: Bois
            - value: métal
              label: Métal
            - value: matériaux-souples
              label: Matériaux souples
            - value: numérique-électronique
              label: Numérique et électronique
      - name: couverture
        label: Couverture
        description: La photo qui représente l'atelier sur l'accueil.
        type: object
        fields:
          - name: fichier
            label: Photo
            description: 2000 px au plus en largeur et en hauteur.
            type: image
            required: true
            options:
              media: ateliers
          - name: description
            label: Description
            description: Ce que montre la photo.
            type: string
            required: true
      - name: body
        label: Texte
        description: En Markdown ; une photo s'écrit ![ce qu'elle montre](/ateliers/photos/nom.jpg), après l'avoir envoyée dans Médias, Photos des ateliers, 2000 px au plus en largeur et en hauteur.
        type: code
        options:
          format: markdown
