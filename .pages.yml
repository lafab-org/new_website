# Pages CMS (https://app.pagescms.org): what editors can change.
# Field names are the front matter names, accents included; every field
# of the front matter is declared, as Pages CMS drops the others on save.

settings:
  commit:
    identity: user

media:
  - name: actualites
    label: Photos des actualités
    input: src/actualites/photos
    output: /actualites/photos
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: realisations
    label: Photos des réalisations
    input: src/realisations/photos
    output: /realisations/photos
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  - name: actualites
    label: Actualités
    type: collection
    path: src/actualites
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    operations:
      rename: false
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Titre
        description: À la création, le nom du fichier doit garder la date AAAA-MM-JJ- par laquelle il commence.
        type: string
        required: true
        options:
          maxlength: 70
      - name: résumé
        label: Résumé
        description: Ce dont parle l'article, en une ou deux phrases.
        type: text
      - name: couverture
        label: Couverture
        type: object
        fields:
          - name: fichier
            label: Photo
            description: 2000 px au plus en largeur et en hauteur.
            type: image
            required: true
            options:
              media: actualites
          - name: description
            label: Description
            description: Ce que montre la photo.
            type: string
            required: true
      - name: mise-en-avant
        label: Mise en avant
        description: Où et jusqu'à quand l'accueil ou l'agenda présentent l'article.
        type: object
        fields:
          - name: pages
            label: Pages
            type: select
            required: true
            options:
              multiple: true
              values:
                - value: accueil
                  label: Accueil
                - value: agenda
                  label: Agenda
          # Strings, not dates: Pages CMS fails on save when a date field
          # sits in an absent object (date-fns parse of undefined).
          - name: début
            label: Début
            description: Au format AAAA-MM-JJ ; sans début, dès la publication.
            type: string
            pattern:
              regex: '^(\d{4}-\d{2}-\d{2})?$'
              message: Une date au format AAAA-MM-JJ.
          - name: fin
            label: Fin
            description: Au format AAAA-MM-JJ ; le dernier jour de la mise en avant, pas avant le début.
            type: string
            required: true
            pattern:
              regex: '^\d{4}-\d{2}-\d{2}$'
              message: Une date au format AAAA-MM-JJ.
      - name: body
        label: Texte
        description: En Markdown ; une photo s'écrit ![ce qu'elle montre](/actualites/photos/nom.jpg).
        type: code
        options:
          format: markdown

  - name: realisations
    label: Réalisations
    type: collection
    path: src/realisations
    subfolders: false
    # Named from the fields at save, as the name field of Pages CMS is
    # generated from the empty entry: the date of the réalisation, not the
    # day of its creation.
    filename: "{date}-{primary}-{auteur}.md"
    operations:
      rename: false
    view:
      fields: [titre, date, auteur]
      primary: titre
      sort: [date, titre]
      default:
        sort: date
        order: desc
    fields:
      - name: titre
        label: Titre
        description: Ce qu'elle est. Avec la date et l'auteur, il nomme le fichier, qui ne change plus ensuite.
        type: string
        required: true
        options:
          maxlength: 70
      - name: date
        label: Date
        description: Le jour où elle a été présentée.
        type: date
        required: true
      - name: auteur
        label: Auteur
        description: Qui l'a faite.
        type: string
        required: true
      - name: catégories
        label: Catégories
        description: Au moins une.
        type: select
        required: true
        options:
          multiple: true
          values:
            - value: association
              label: Vie de l'association
            - value: bois
              label: Bois
            - value: métal
              label: Métal
            - value: matériaux-souples
              label: Matériaux souples
            - value: numérique-électronique
              label: Numérique et électronique
      - name: photos
        label: Photos
        description: Au moins une, dans l'ordre où elles sont montrées.
        type: object
        list: true
        required: true
        fields:
          - name: fichier
            label: Photo
            description: 2000 px au plus en largeur et en hauteur.
            type: image
            required: true
            options:
              media: realisations
          - name: description
            label: Description
            description: Ce que montre la photo.
            type: string
            required: true
